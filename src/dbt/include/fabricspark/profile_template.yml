fixed:
  type: fabricspark
prompts:
  _choose_authentication_method:
    livy:
      _fixed_method: livy
      workspaceid:
        hint: GUID of the workspace. Open the workspace from fabric.microsoft.com and copy the workspace url
      lakehouse:
        hint: Name of the Lakehouse in the workspace that you want to connect to
      lakehouseid:
        hint: GUID of the lakehouse, which can be extracted from url when you open lakehouse artifact from fabric.microsoft.com
      endpoint:
        default: https://api.fabric.microsoft.com/v1
      auth:
        default: CLI
        hint: One of CLI (az login), SPN (client_id/secret/tenant), fabric_notebook, or token_credential (custom TokenCredential)
      client_id:
        hint: Use when SPN auth is used.
      client_secret:
        hint: Use when SPN auth is used.
      tenant_id:
        hint: Use when SPN auth is used.
      credential_class:
        hint: Use when token_credential auth is used. Dotted path to a class implementing azure.core.credentials.TokenCredential (e.g. my_pkg.auth.ExternalTokenCredential).
      credential_kwargs:
        hint: Use when token_credential auth is used. Mapping of kwargs passed to credential_class on instantiation.
      connect_retries:
        default: 0
        type: 'int'
      connect_timeout:
        default: 10
        type: 'int'
      session_id_file:
        hint: Optional path to file storing Livy session ID for session reuse. Defaults to ./livy-session-id.txt if not specified.
      high_concurrency:
        hint: When true (default), each dbt thread gets its own REPL inside one underlying Livy session via Fabric's high-concurrency Livy API — statements from different threads run in parallel. When false, falls back to the legacy single-session-per-process mode where statements execute FIFO inside the default Spark scheduling pool. Has no effect in local mode.
        type: 'bool'
        default: true
      workspace_name:
        hint: Optional. Default workspace name for cross-workspace 4-part naming. When set and the target lakehouse has schemas enabled, all relations without an explicit model-level workspace_name will be prefixed with this workspace. Ignored for non-schema lakehouses. Precedence: model config(workspace_name=...) > this value.
      quote_identifiers:
        hint: When true, backtick-quotes table identifiers so Fabric Spark preserves their casing instead of folding to lowercase. Requires spark.sql.caseSensitive=true under spark_config.conf to take effect. Session-wide (also affects column resolution). Defaults to false.
        type: 'bool'
        default: false
      auto_optimize:
        hint: When true (default), the adapter runs OPTIMIZE on Delta relations after every table, incremental and snapshot build so downstream joins are not slowed down by small-file fragmentation. Individual models can override with config(auto_optimize=false), and the DBT_FABRICSPARK_SKIP_OPTIMIZE environment variable disables it outright.
        type: 'bool'
        default: true
      api_calls_per_minute:
        hint: Process-wide Fabric REST call ceiling per minute, shared across dbt threads for this endpoint and identity. Default 150 leaves headroom under Fabric's per-identity quota for other tooling and concurrent dbt processes. Set to 0 to disable the limiter; shared Retry-After backoff still applies. Ignored in local mode.
        type: 'int'
        default: 150
      adaptive_polling:
        hint: When true, Fabric high-concurrency mode uses one extra monitor REPL per underlying Livy session to read Spark task telemetry and reduce statement polling. If spark.highConcurrency.max is not set in spark_config.conf, the adapter sizes it to max(5, min(threads + 2, 50)); explicit user values are respected. Falls back safely to schedule-based polling if telemetry is unavailable. Ignored in local mode.
        type: 'bool'
        default: false
  schema:
    hint: 'default schema that dbt will build objects in'
  threads:
    hint: '1 or more'
    type: 'int'
    default: 1
